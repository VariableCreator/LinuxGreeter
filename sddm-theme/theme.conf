[General]
# --- Win11 glass look ---
# Accent color for login button, focus rings, spinner dots, glows.
accentColor=#0078D4
accentHMColor=#FC5555
# Base behind/below the background image (also gradient base if no image).
backgroundColor=#1A1C22
# Main text color on glass / lock screen.
textColor=#FFFFFF
# UI font family (empty = bundled SDDM default). e.g. "Segoe UI", "Inter".
fontFamily=
# Clock format on lock + top bar: true = 24h, false = 12h AM/PM.
use24HourClock=false
# Lock screen first (like Win11 / reference theme). Any key/click -> login.
showLockScreen=true
# Idle screensaver: seconds without input (key, click, mouse movement, typing)
# until the lock screen appears over the dimmed sign-in card. Any input
# dismisses it and puts the cursor into the password field. 0 = off.
lockAfterSeconds=300
# Background image shown fullscreen (SDDM key "background", plus alias
# "backgroundImage" - both relative to theme dir).
background=images/background.png
backgroundImage=images/background.png

primaryShade=
primaryLight=
primaryDark=

primaryHue1=
primaryHue2=
primaryHue3=

accentShade=
accentLight=

accentHue1=
accentHue2=
accentHue3=

normalText=

successText=
failureText=
warningText=

rebootColor=
powerColor=

# --- HM login (oidc-login browser) ---
# Program started by the "HM Anmeldung" button.
oidcLoginCommand=/usr/bin/oidc-login
# Label of the button in the greeter.
hmLoginLabel=HM Anmeldung
# true = open the browser right when the greeter starts (normal login stays
#        visible alongside). false = button in the greeter.
hmLoginAutostart=false
# true  = log in directly after a successful HM login: no second
#         password, no "Login" click (oidc-login passes the captured
#         credentials to the greeter for this).
# false = old flow: show message, type the HM password manually.
autoLoginAfterHm=true

# Text color on the background image (default: dark HM blue #1A237E).
onBackgroundText=
