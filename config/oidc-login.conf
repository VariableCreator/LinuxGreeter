# oidc-login – central configuration
# ================================
# This is the SINGLE place to adjust URLs, cookie names, spool paths,
# network-drive settings and timeouts. The code of every component
# (shell helpers, Python helpers, Qt browser, install.sh) contains NO
# duplicate default values for the keys defined here - whatever is set
# below is what the system uses.
# Installed to:
#   /etc/oidc-login/oidc-login.conf   (root-readable, no secrets inside)
# NOTE: install.sh (re)writes the installed copy from THIS template on every
# run - customize here (repo), never in /etc (it gets overwritten).
#
# Format is flat KEY=VALUE (shell-sourcable AND parsed by the Python
# helpers AND by the Qt browser). Rules:
#   * one KEY=VALUE per line, no `export`, no spaces around `=`
#   * `#` starts a comment, empty lines are ignored
#   * values with spaces/quotes: wrap in single or double quotes
#   * an environment variable that is ALREADY SET always wins over this
#     file (so OIDC_* env vars, e.g. OIDC_AUTOLOAD for a quick test,
#     override the value defined here).
#
# After editing run:  sudo ./install.sh   (re-syncs theme.conf + helpers)
# Or just restart the greeter / session – every component re-reads this
# file on start.

# --- 1. Browser: which page is opened -------------------------------
# The OIDC entry page the kiosk browser loads on "HM-Anmeldung".
OIDC_AUTOLOAD=https://login.cs.hm.edu/labaccess/
# Comma-separated list of URLs that count as "target page reached"
# (the OIDC flow lands on /redirect_uri after login).
OIDC_ACCEPTED_PAGES=https://login.cs.hm.edu/labaccess/,https://login.cs.hm.edu/,https://login.cs.hm.edu/redirect_uri
# Comma-separated URL patterns the credential capture watches.
# Empty = watch all domains (kiosk browser). Example to restrict:
# OIDC_CAPTURE_PATTERNS=https://*.hm.edu/*,http://*.hm.edu/*
OIDC_CAPTURE_PATTERNS=

# --- 2. Cookies: names ----------------------------------------------
# Relying-party session cookie (Apache mod_auth_openidc) – triggers login.
OIDC_RP_COOKIE=mod_auth_openidc_session
# Identity-provider session cookies (comma-separated) – prevent the
# credential prompt on ALL HM services. Copied alongside the RP cookie.
OIDC_IDP_COOKIES=shibboleth,__Host-JSESSIONID,__Host-shib_idp_session

# --- 3. Post-login helpers (run as user sddm via sudo) --------------
# Network/root grant script (legacy FK07 netboot). Empty/disabled skips it.
# Program + arguments separately (the browser runs program + args + cookie).
OIDC_HELPER=sudo
# Arguments for OIDC_HELPER (space-separated, cookie appended at runtime).
OIDC_HELPER_ARGS=/opt/oidc-login/check-and-grant.py
# Account script that creates the temporary admin account.
OIDC_SESSION_ACCOUNT=/usr/local/sbin/oidc-session-account

# --- 4. Greeter UI (synced into theme.conf by install.sh) -----------
# Program the "HM-Anmeldung" button starts (theme.conf: oidcLoginCommand).
OIDC_LOGIN_COMMAND=/usr/bin/oidc-login
# Button label in the greeter (theme.conf: hmLoginLabel).
HM_LOGIN_LABEL=HM-Anmeldung
# true = open browser right at greeter start, false = show button only.
HM_LOGIN_AUTOSTART=false
# Auto-login switch (theme.conf: autoLoginAfterHm) - the only switch for the
# automatic greeter login. The greeter passes "--autologin" to oidc-login
# itself, so no extra CLI args are configured here.
# true  = log in directly after HM login (no 2nd password/click),
# false = show message, type HM password manually.
AUTO_LOGIN_AFTER_HM=true

# --- 4b. Greeter theme: look & colors (synced into theme.conf) --------
# install.sh writes these values into theme.conf on EVERY run and
# OVERWRITES values already there (the central config always wins).
# Leave a key empty or omit it = theme.conf default stays.
# Accent color for login button.
THEME_ACCENT_COLOR=#0078D4
# Base behind/below the background image (gradient base if no image).
THEME_BACKGROUND_COLOR=#1A1C22
# Main text color on glass / lock screen.
THEME_TEXT_COLOR=#FFFFFF
# UI font (empty = SDDM default), e.g. Segoe UI or Inter.
THEME_FONT_FAMILY=
# true = 24h clock (lock + top bar), false = 12h AM/PM.
THEME_USE_24H_CLOCK=false
# true = lock screen first (key/click -> login), false = direct login.
THEME_SHOW_LOCK_SCREEN=true
# Seconds without input until the lock screen (screensaver) dims the greeter.
# Any key/click/mouse movement dismisses it and focuses the password field.
# 0 = no automatic lock.
THEME_LOCK_AFTER_SECONDS=300
# Text color on the background image (empty = dark HM blue #1A237E).
THEME_ON_BACKGROUND_TEXT=
# On-screen keyboard in the SDDM greeter (SDDM `InputMethod=` setting).
#   empty/disabled = NO virtual keyboard (default: physical keyboard only)
#   qtvirtualkeyboard = Qt Virtual Keyboard (needs the Qt plugin installed)
#   ibus / maliit / ... = other input methods (see `man sddm.conf`)
# install.sh writes this as `InputMethod=` (explicitly empty) into the
# [General] section of /etc/sddm.conf.d/99-maya-hm.conf; removing the
# line is NOT enough on SDDM 0.21/Qt6 (Debian 13/Ubuntu 26), the empty
# value is what reliably disables the keyboard.
SDDM_INPUT_METHOD=

# --- 5. Spool / state paths -----------------------------------------
# Tracking file for temporary session accounts (root-only, 0600).
# track_user() writes to here after a successful useradd
OIDC_ACCOUNTS_FILE=/etc/oidc-login/session-accounts
# SSO cookie spool: directory inside the account home (0700), one file per cookie.
OIDC_SSO_SPOOL_REL=.cache/oidc-login/sso-cookies
# Cloud-storage spool inside the account home (0600).
OIDC_CLOUD_SPOOL_REL=.cache/oidc-login/cloud-storage
# Marker comment (GECOS) for accounts we created.
OIDC_ACCOUNT_COMMENT=Login
# Fallback suffix when the HM name is taken by a real account.
OIDC_SESSION_SUFFIX=-hm
# Account lifetime: true = temporary account (deleted on logout and at the
# next greeter start), false = persistent account (survives logout and the
# greeter-start cleanup; re-login only refreshes password and cookie spools).
# Manual 'delete-user' and 'cleanup-all --force' still delete.
OIDC_SESSION_TEMPORARY=false

# --- 6. Firefox SSO import ------------------------------------------
# Lifetime (seconds) given to session cookies (expiry=0): 43200 = 12 h.
OIDC_SSO_SESSION_LIFETIME=43200
# Minimum remaining lifetime (seconds): near-expired cookies get bumped to this.
OIDC_SSO_MIN_LIFETIME=3600
# Seconds to wait for a running Firefox to exit before injecting cookies.
OIDC_FIREFOX_TIMEOUT=30
# Max seconds the background watcher waits for Firefox to exit (--wait-for-firefox).
OIDC_FIREFOX_WATCH_MAX=1800

# --- 7. Network drive (LRZ cloud storage via WebDAV/GVFS) -----------
# WebDAV host of the cloud storage (used as https://HOST+PATH unless URL set).
OIDC_CLOUD_HOST=webdisk.ads.mwn.de
# WebDAV base path on the host (used as https://HOST+PATH unless URL set).
OIDC_CLOUD_PATH=/hcwebdav
# Full URL override – if empty it is built as https://HOST+PATH.
OIDC_CLOUD_URL=
# Windows/AD domain for the GVFS mount authentication (Gio MountOperation
# set_domain; login goes as DOMAIN\<lrz-user>, e.g. ADS\hm-tester).
# Examples:
#   ADS   = LRZ WebDAV domain (default for webdisk.ads.mwn.de; empty also falls back to ADS).
#   HM    = custom AD domain if you host the WebDAV server under another domain.
OIDC_CLOUD_DOMAIN=ADS
# Entry in the file manager after a successful mount: the symlink
# ~/<OIDC_CLOUD_LINK> -> /run/user/$UID/gvfs/... (like the ~/Cloud-Storage of
# older versions).
#
# OIDC_CLOUD_SYMLINK: create the symlink. Default true: it works in file
#   managers that treat the gvfs FUSE path as a remote location
#   (GNOME Files/Nautilus, Dolphin, ...).
#   install.sh (section 3d) switches this off automatically in two cases:
#     1. Ubuntu (all flavors, Xubuntu/XFCE included: ID=ubuntu, or ID_LIKE=ubuntu
#        for derivatives such as Linux Mint/Pop!_OS): there the mounted network
#        drive is already listed on the left in the file manager ("Networks" /
#        "Other Locations"), so a folder in the home directory would only be a
#        duplicate. Ubuntu therefore never gets ~/Cloud-Storage; the folder is
#        only created on the other systems (Debian, Fedora/RHEL).
#     2. Thunar is the DEFAULT HANDLER for inode/directory (i.e. the program
#        that would open the folder): there the symlink opens a LOCAL path
#        inside the gvfs FUSE mount, Thunar aborts the directory scan on the
#        first unreadable child (the LRZ root contains a folder that answers
#        HTTP 401 for ADS\\hm-<id>) and the folder stays in "Loading folder
#        contents..." forever. Merely having a Thunar package installed does
#        NOT disable it, so the folder stays on Debian with KDE/GNOME.
#   A leftover symlink from an older installation is removed automatically
#   while this stays false; a real file/dir with that name is left alone.
OIDC_CLOUD_SYMLINK=true
# Name of that symlink in the home (only used with OIDC_CLOUD_SYMLINK=true;
# a leftover with this name is cleaned up while the symlink is disabled).
# Examples:
#   Cloud-Storage = default (~/Cloud-Storage).
#   Netzlaufwerk  = German label (~/Netzlaufwerk).
#   LRZ-Cloud     = short alt name (~/LRZ-Cloud).
# Note: if a real file/dir with that name already exists, no symlink is
# created; a broken leftover symlink is removed automatically.
OIDC_CLOUD_LINK=Cloud-Storage
# Mount handshake timeout in seconds (gio mount operation).
OIDC_CLOUD_TIMEOUT=60
# Total seconds to wait for network/reachability at session start (polled).
OIDC_CLOUD_WAIT=90
# TCP connect timeout in seconds for the single reachability probe.
OIDC_CLOUD_CONNECT_TIMEOUT=15

# --- 8. System suspend (sleep) -------------------------------------
# A suspended VM cannot be woken from inside the guest: VirtualBox/VMware/QEMU
# guests have no working S3 (only s2idle), so after the trigger the screen
# stays black and NO input works - not even Ctrl+Alt+F3, neither keyboard nor
# mouse. Session power managers (xfce4-power-manager, ...) suspend by default
# after some idle minutes, so install.sh neutralises that.
#   auto  = block suspend only inside a virtual machine (recommended)
#   true  = always block suspend
#   false = leave the system's suspend configuration untouched
OIDC_DISABLE_SUSPEND=auto
